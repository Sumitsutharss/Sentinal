name: Sentinel Automated QA Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  qa-validation:
    name: Run Core Sentinel QA Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Start Sentinel Server
        run: |
          node server.js &
          sleep 3

      - name: Run End-to-End QA Test Suite
        run: node test_qa.js
